name: Verify

on:
  push:
  pull_request:

jobs:
  documentation-and-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated configuration inventory
        run: python3 tools/generate_readme_config.py --check
      - name: Test configuration inventory generator
        run: python3 -m unittest tools/test_generate_readme_config.py
      - name: Verify fixed font mapping
        run: python3 tools/verify_font_mapping.py
      - name: Parse watch-face resource XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('watchface/src/main/res/raw/watchface.xml'); ET.parse('watchface/src/main/res/values/strings.xml')"
      - name: Build debug watch face
        run: bash ./gradlew :watchface:assembleDebug
